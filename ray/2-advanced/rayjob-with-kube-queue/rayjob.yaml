apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-queue-code
  namespace: ray-queue-demo
data:
  main.py: |
    import ray

    ray.init(address="auto")

    @ray.remote(num_cpus=1)
    def square(value):
        return value * value

    results = ray.get([square.remote(value) for value in range(1, 6)])
    total = sum(results)
    assert total == 55, results
    print(f"squares: {results}", flush=True)
    print(f"total: {total}", flush=True)
    ray.shutdown()
---
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: ray-queue-demo
  namespace: ray-queue-demo
spec:
  suspend: true
  submissionMode: K8sJobMode
  entrypoint: python /home/ray/job/main.py
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 300
  submitterPodTemplate:
    spec:
      restartPolicy: Never
      containers:
        - name: ray-job-submitter
          image: rayproject/ray:2.48.0
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  rayClusterSpec:
    rayVersion: "2.48.0"
    enableInTreeAutoscaling: false
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"
      template:
        spec:
          containers:
            - name: ray-head
              image: rayproject/ray:2.48.0
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
              volumeMounts:
                - name: job-code
                  mountPath: /home/ray/job
                  readOnly: true
          volumes:
            - name: job-code
              configMap:
                name: ray-queue-code
    workerGroupSpecs:
      - groupName: cpu-worker
        replicas: 1
        minReplicas: 1
        maxReplicas: 1
        rayStartParams: {}
        template:
          spec:
            containers:
              - name: ray-worker
                image: rayproject/ray:2.48.0
                resources:
                  requests:
                    cpu: "1"
                    memory: 2Gi
                  limits:
                    cpu: "1"
                    memory: 2Gi
                volumeMounts:
                  - name: job-code
                    mountPath: /home/ray/job
                    readOnly: true
            volumes:
              - name: job-code
                configMap:
                  name: ray-queue-code
