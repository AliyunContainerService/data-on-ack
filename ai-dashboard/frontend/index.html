<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Suite Operations Console — cluster operations, quotas, workloads and cost analytics on Alibaba Cloud ACK" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>AI Dashboard</title>
    <style>
      /* Branded splash shown until React mounts (replaced by createRoot render) */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f5f5f7;
      }
      #root:empty::before {
        content: '';
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, #0071e3, #5856d6);
        box-shadow: 0 8px 22px -6px rgba(0, 113, 227, 0.38);
        animation: splash-pulse 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      #root:empty::after {
        content: '';
        position: absolute;
        width: 120px;
        height: 4px;
        border-radius: 4px;
        margin-top: 84px;
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.06) 25%, rgba(0, 113, 227, 0.35) 50%, rgba(0, 0, 0, 0.06) 75%);
        background-size: 200% 100%;
        animation: splash-bar 1.1s linear infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.88); opacity: 0.85; }
      }
      @keyframes splash-bar {
        0% { background-position: 100% 0; }
        100% { background-position: -100% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
