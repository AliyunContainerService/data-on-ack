apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: hadoop-oss
    namespace: kyuubi
    env: conf/oss-creds.env
  - name: hadoop-oss
    namespace: spark
    env: conf/oss-creds.env
configMapGenerator:
- name: spark-conf
  namespace: kyuubi
  files:
  - conf/spark-defaults.conf
- name: kyuubi-conf
  namespace: kyuubi
  files:
  - conf/kyuubi-defaults.conf
resources:
- role.yaml
- role-binding.yaml
- service-account.yaml