# Default values for ai-dev-console.
# 用户必须提供的参数标记为 [REQUIRED]

global:
  clusterProfile: Default

dev-console:
  replicaCount: 1
  image:
    repository: registry-cn-hangzhou.ack.aliyuncs.com/acs/ai-dev-console
    tag: "v3.2.0"
    pullPolicy: IfNotPresent
    commitAgentImageName: registry-cn-hangzhou.ack.aliyuncs.com/acs/commit-agent
    commitAgentImageTag: v0.2.0
  commitAgent:
    socketAddress: /host/run/commit-agent/commit-agent.sock
    logLevel: info
    logFormat: json
    requestTimeout: 30m
    shutdownTimeout: 30s
    maxConcurrentCommit: 4
    maxConcurrentPush: 4
    runtime: ""
    containerdNamespace: k8s.io
    allowedUIDs: ""
    pushRetry:
      attempts: 3
      initialDelay: 2s
      maxDelay: 30s
    metrics:
      enabled: true
      port: 9090
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 1Gi
      limits:
        cpu: 500m
        memory: 256Mi
        ephemeral-storage: 4Gi
    priorityClassName: system-node-critical
    nodeSelector: {}
    tolerations:
      - operator: Exists
  resources:
    limits:
      cpu: 2000m
      memory: 500Mi
    requests:
      cpu: 500m
      memory: 100Mi

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    create: true
    annotations: {}
    name: ai-dev-console

  podSecurityContext: {}
  securityContext: {}

  service:
    type: ClusterIP
    port: 80
    containerPort: 9090

  console:
    # 是否为国际站账号
    intlAccount: "false"
    # 管理员阿里云 UID (可选)
    adminUid: ""
    # 凭据模式: static (AK/SK) 或 rrsa
    credentialMode: "static"
    # 是否自动创建 RAM OAuth2 Web App
    createWebApp: true
    ingress:
      # [REQUIRED] 必须启用并设置域名
      enabled: true
      annotations:
        kubernetes.io/ingress.class: nginx
      hosts:
      # [REQUIRED] 开发控制台访问域名
      - host: ai-dev-console.local
        paths:
        - /
      tls: []
    # RRSA 凭据 (credentialMode=rrsa 时配置)
    rrsa:
      oidcProviderArn: ""
      oidcTokenFile: "/var/run/secrets/tokens/oidc-token"

  # 镜像仓库前缀映射：把内置 AC2 开发镜像地址重写到集群可达的仓库
  # （无公网出口 / 跨地域集群同步镜像后使用）。示例：
  # imageRewrites:
  #   - from: ac2-registry.cn-hangzhou.cr.aliyuncs.com/ac2/
  #     to: registry-vpc.cn-beijing.aliyuncs.com/huozx/
  imageRewrites: []

  # 认证与会话配置
  auth:
    # 认证模式:
    #   none (默认)   - 免登录，所有请求以内置 admin 身份运行，拥有全部权限；无需配置阿里云凭据，开箱即用
    #   aliyun        - 阿里云 RAM OAuth2 SSO 登录（生产推荐，需 AK/SK 与 IMS 权限）
    #   custom        - 接入客户自定义用户系统，信任上游网关注入的身份请求头
    # ⚠️ none 模式下任何能访问控制台地址的人都拥有全部权限，仅限内网/PoC 或已有外层访问控制的环境；
    #    生产环境请改用 aliyun 或 custom，或为入口配置访问控制。
    mode: "none"
    # custom 模式配置 (mode=custom 时生效)
    custom:
      # 上游网关注入的用户名请求头
      userHeader: "X-Forwarded-User"
      # 上游网关注入的用户组请求头 (逗号分隔，可选)
      groupsHeader: "X-Forwarded-Groups"
      # 授予 admin 角色的用户列表 (逗号分隔)
      adminUsers: ""
      # 授予 admin 角色的用户组列表 (逗号分隔)
      adminGroups: ""
      # 未认证浏览器请求的重定向地址，如企业 SSO 登录页 (可选)
      loginUrl: ""
    # none 模式下列表接口使用的命名空间范围 (逗号分隔)
    noneNamespaces: "default,default-group,kube-ai"
    # Session 持久化 Secret (推荐)
    # 创建: kubectl create secret generic ai-dev-console-auth --from-literal=sessionSecret=$(openssl rand -hex 32) -n kube-ai
    existingSecret: ""
    secureCookie: false
    oauthSigninURL: ""
    oauthTokenURL: ""

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Notebook Controller
notebook:
  replicaCount: 1
  image:
    repository: registry-cn-hangzhou.ack.aliyuncs.com/acs/notebook-controller
    pullPolicy: IfNotPresent
    tag: v1.1.0
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  serviceAccount:
    create: true
    annotations: {}
    name: "notebook-controller-service-account"

labels:
  app: notebook-controller
