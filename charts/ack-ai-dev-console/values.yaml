# Default values for ai-dev-console.
# 用户必须提供的参数标记为 [REQUIRED]

global:
  clusterProfile: Default

dev-console:
  replicaCount: 1
  image:
    repository: registry-cn-hangzhou.ack.aliyuncs.com/dev/ai-dev-console
    tag: "v3.0.0"
    pullPolicy: Always
    commitAgentImageName: registry-cn-beijing.ack.aliyuncs.com/acs/commit-agent
    commitAgentImageTag: v0.1.1-9d4e12d-aliyun
  commitAgent:
    socketAddress: /host/run/commit-agent/commit-agent.sock
    logLevel: info
    logFormat: json
    requestTimeout: 30m
    shutdownTimeout: 30s
    maxConcurrentCommit: 4
    maxConcurrentPush: 4
    runtime: ""
    containerdNamespace: k8s.io
    allowedUIDs: ""
    pushRetry:
      attempts: 3
      initialDelay: 2s
      maxDelay: 30s
    metrics:
      enabled: true
      port: 9090
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 1Gi
      limits:
        cpu: 500m
        memory: 256Mi
        ephemeral-storage: 4Gi
    priorityClassName: system-node-critical
    nodeSelector: {}
    tolerations:
      - operator: Exists
  resources:
    limits:
      cpu: 2000m
      memory: 500Mi
    requests:
      cpu: 500m
      memory: 100Mi

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    create: true
    annotations: {}
    name: ai-dev-console

  podSecurityContext: {}
  securityContext: {}

  service:
    type: ClusterIP
    port: 80
    containerPort: 9090

  console:
    # 是否为国际站账号
    intlAccount: "false"
    # 管理员阿里云 UID (可选)
    adminUid: ""
    # 凭据模式: static (AK/SK) 或 rrsa
    credentialMode: "static"
    # 是否自动创建 RAM OAuth2 Web App
    createWebApp: true
    ingress:
      # [REQUIRED] 必须启用并设置域名
      enabled: true
      annotations:
        kubernetes.io/ingress.class: nginx
      hosts:
      # [REQUIRED] 开发控制台访问域名
      - host: ai-dev-console.local
        paths:
        - /
      tls: []
    # RRSA 凭据 (credentialMode=rrsa 时配置)
    rrsa:
      oidcProviderArn: ""
      oidcTokenFile: "/var/run/secrets/tokens/oidc-token"

  # 认证与会话配置
  auth:
    # Session 持久化 Secret (推荐)
    # 创建: kubectl create secret generic ai-dev-console-auth --from-literal=sessionSecret=$(openssl rand -hex 32) -n kube-ai
    existingSecret: ""
    secureCookie: false
    oauthSigninURL: ""
    oauthTokenURL: ""

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Notebook Controller
notebook:
  replicaCount: 1
  image:
    repository: registry-cn-beijing.ack.aliyuncs.com/acs/notebook-controller
    pullPolicy: Always
    tag: v1.0.1-2d004d0-aliyun
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  serviceAccount:
    create: true
    annotations: {}
    name: "notebook-controller-service-account"

labels:
  app: notebook-controller
