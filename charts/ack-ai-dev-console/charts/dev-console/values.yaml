# Default values for ai-dev-console.

replicaCount: 1

image:
  repository: registry.cn-beijing.aliyuncs.com/acs/ai-dev-console
  tag: "latest"
  pullPolicy: Always

resources:
  limits:
    cpu: 2000m
    memory: 500Mi
  requests:
    cpu: 500m
    memory: 100Mi

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ai-dev-console

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  containerPort: 9090

console:
  intlAccount: "false"
  adminUid: ""
  credentialMode: "static"
  # Set to true to create RAM OAuth2 Web App on startup
  createWebApp: true
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
    hosts:
    - host: ai-dev-console.local
      paths:
      - /
    tls: []
  # RRSA credential (alternative to AK/SK)
  rrsa:
    oidcProviderArn: ""
    oidcTokenFile: "/var/run/secrets/tokens/oidc-token"

# Authentication and session configuration
auth:
  # Name of an existing Secret containing 'sessionSecret' key.
  # Create with: kubectl create secret generic ai-dev-console-auth --from-literal=sessionSecret=$(openssl rand -hex 32) -n kube-ai
  existingSecret: ""
  secureCookie: false
  oauthSigninURL: ""
  oauthTokenURL: ""

nodeSelector: {}
tolerations: []
affinity: {}
