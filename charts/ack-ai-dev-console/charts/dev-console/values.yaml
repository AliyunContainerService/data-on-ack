# Default values for ai-dev-ui.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: registry-cn-beijing.ack.aliyuncs.com/acs/kubeai-dev-console
  tag: 1.0.1-be3b921d
  pullPolicy: Always
  checkMysqlImageName: busybox
  checkMysqlImageTag: stable

resources:
  limits:
    cpu: 2000m
    memory: 500Mi
  requests:
    cpu: 500m
    memory: 100Mi

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ai-dev-console-ui

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  containerPort: 9090

console:
  intlAccount: "false"
  adminUid: ""
  ingress:
    enabled: false
    annotations: {}
    hosts:
    - host: ai-dev-console.local
      paths: []
    tls: []

# Authentication and session configuration
auth:
  # Name of an existing Secret containing 'sessionSecret' key.
  # If empty, a random key is generated on each pod restart (sessions lost).
  # Create with: kubectl create secret generic ai-dev-console-auth --from-literal=sessionSecret=$(openssl rand -hex 32) -n kube-ai
  existingSecret: ""
  # Set to true when TLS is enabled on Ingress
  secureCookie: false
  # OAuth signin URL override (leave empty to use default aliyun.com endpoint)
  oauthSigninURL: ""
  # OAuth token URL override
  oauthTokenURL: ""

storage:
  mysql:
    enabled: true
    host: ""

ingress:
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
