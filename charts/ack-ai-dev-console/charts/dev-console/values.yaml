# Default values for ai-dev-console.

replicaCount: 1

image:
  repository: registry-cn-hangzhou.ack.aliyuncs.com/dev/ai-dev-console
  tag: "v3.1.0"
  pullPolicy: Always

resources:
  limits:
    cpu: 2000m
    # 1Gi: agent sessions (in-memory history) + SSE connections need headroom
    # beyond the previous 500Mi (design §7).
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 100Mi

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ai-dev-console

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  containerPort: 9090

console:
  intlAccount: "false"
  adminUid: ""
  credentialMode: "static"
  # Set to true to create RAM OAuth2 Web App on startup
  createWebApp: true
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
      # Agent SSE streams (/api/v1/agent/runs/*/events) must survive long
      # tool executions and HITL confirmation waits (nginx default read
      # timeout is 60s); buffering would batch SSE frames.
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
    hosts:
    - host: ai-dev-console.local
      paths:
      - /
    tls: []
  # RRSA credential (alternative to AK/SK)
  rrsa:
    oidcProviderArn: ""
    oidcTokenFile: "/var/run/secrets/tokens/oidc-token"
    # RAM role ARN to assume (required for rrsa mode), e.g. acs:ram::<UID>:role/<role-name>
    roleArn: ""

# Authentication and session configuration
# Agentic console (docs/design/agentic-console.md). The agent is an optional
# add-on: entry points stay hidden unless enabled AND a model key is present.
agent:
  enabled: false
  model:
    # "dashscope" or "openai-compatible"
    provider: dashscope
    # diagnosis contexts are token-heavy; plus keeps cost predictable
    name: qwen-plus
    # Optional gateway override (must be an allowlisted/internal endpoint)
    baseURL: ""
    # API key is read from Secret ai-dev-console-agent-credentials (key: apiKey)
  budget:
    # Hard per-user daily model spend cap in USD
    maxDailyCostUSD: 2

auth:
  # Name of an existing Secret containing 'sessionSecret' key.
  # Create with: kubectl create secret generic ai-dev-console-auth --from-literal=sessionSecret=$(openssl rand -hex 32) -n kube-ai
  existingSecret: ""
  secureCookie: false
  oauthSigninURL: ""
  oauthTokenURL: ""

nodeSelector: {}
tolerations: []
affinity: {}
