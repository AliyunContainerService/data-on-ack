{{- if not .Values.auth.existingSecret }}
{{- $secretName := printf "%s-session" (include "dev-console.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
# Auto-generated session secret so that sessions survive pod restarts and are
# shared across replicas. The value is stable across `helm upgrade` (lookup).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dev-console.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "sessionSecret") }}
  sessionSecret: {{ index $existing.data "sessionSecret" }}
  {{- else }}
  sessionSecret: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
