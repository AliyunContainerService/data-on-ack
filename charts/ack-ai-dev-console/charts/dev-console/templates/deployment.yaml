apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dev-console.fullname" . }}
  labels:
    {{- include "dev-console.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dev-console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dev-console.selectorLabels" . | nindent 8 }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "dev-console.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or (not .Values.console.createWebApp) (ne (.Values.auth.mode | default "aliyun") "aliyun") }}
          args:
            - --disable-oauth
          {{- end }}
          env:
            - name: AUTH_MODE
              value: "{{ .Values.auth.mode | default "aliyun" }}"
            {{- if eq (.Values.auth.mode | default "aliyun") "custom" }}
            - name: AUTH_USER_HEADER
              value: "{{ .Values.auth.custom.userHeader }}"
            - name: AUTH_GROUPS_HEADER
              value: "{{ .Values.auth.custom.groupsHeader }}"
            - name: AUTH_ADMIN_USERS
              value: "{{ .Values.auth.custom.adminUsers }}"
            - name: AUTH_ADMIN_GROUPS
              value: "{{ .Values.auth.custom.adminGroups }}"
            - name: AUTH_LOGIN_URL
              value: "{{ .Values.auth.custom.loginUrl }}"
            {{- end }}
            {{- if eq (.Values.auth.mode | default "aliyun") "none" }}
            - name: AUTH_NONE_NAMESPACES
              value: "{{ .Values.auth.noneNamespaces }}"
            {{- end }}
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBE_DL_INGRESS_ENABLE
              value: "{{ .Values.console.ingress.enabled }}"
            {{- if .Values.console.ingress.enabled }}
            - name: DEV_CONSOLE_HOST
              value: "{{ (index .Values.console.ingress.hosts 0).host }}"
            {{- end }}
            - name: CONSOLE_ADMINUID
              value: "{{ .Values.console.adminUid }}"
            - name: INTL_ACCOUNT
              value: "{{ .Values.console.intlAccount }}"
            - name: CREDENTIAL_MODE
              value: "{{ .Values.console.credentialMode }}"
            - name: AK_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ai-dev-console-credentials
                  key: accessKeyId
                  optional: true
            - name: AK_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-dev-console-credentials
                  key: accessKeySecret
                  optional: true
            - name: OIDC_PROVIDER_ARN
              value: "{{ .Values.console.rrsa.oidcProviderArn }}"
            - name: OIDC_TOKEN_FILE
              value: "{{ .Values.console.rrsa.oidcTokenFile }}"
            - name: OIDC_ROLE_ARN
              value: "{{ .Values.console.rrsa.roleArn }}"
            - name: FRONTEND_DIR
              value: "/app/dist"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-session" (include "dev-console.fullname" .)) }}
                  key: sessionSecret
            - name: ENABLE_SECURE_COOKIE
              value: "{{ .Values.auth.secureCookie }}"
            {{- if .Values.auth.oauthSigninURL }}
            - name: OAUTH_SIGNIN_URL
              value: "{{ .Values.auth.oauthSigninURL }}"
            {{- end }}
            {{- if .Values.auth.oauthTokenURL }}
            - name: OAUTH_TOKEN_URL
              value: "{{ .Values.auth.oauthTokenURL }}"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
