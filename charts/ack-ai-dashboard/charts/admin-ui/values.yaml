replicaCount: 1

image:
  repository: registry-cn-hangzhou.ack.aliyuncs.com/dev/ai-dashboard
  tag: "v3.2.0"
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ai-dashboard-admin

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  containerPort: 8080

dashboard:
  intlAccount: "false"
  adminUid: ""
  credentialMode: "static"
  # Set to true to create RAM OAuth2 Web App on startup
  createWebApp: true
  # Grafana reverse proxy target (service inside cluster)
  grafanaProxyTarget: "ack-ai-dashboard-grafana.kube-ai:80"
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
    hosts:
    - host: ai-dashboard.local
      paths:
      - /
    tls: []

# Authentication and session configuration
auth:
  # 认证模式:
  #   aliyun (默认) - 阿里云 RAM OAuth2 SSO 登录
  #   none          - 免登录，所有请求以内置 admin 身份运行，拥有全部权限；无需配置阿里云凭据
  #   custom        - 接入客户自定义用户系统，信任上游网关注入的身份请求头
  mode: "aliyun"
  # custom 模式配置 (mode=custom 时生效)
  custom:
    # 上游网关注入的用户名请求头
    userHeader: "X-Forwarded-User"
    # 上游网关注入的用户组请求头 (逗号分隔，可选)
    groupsHeader: "X-Forwarded-Groups"
    # 授予 admin 角色的用户列表 (逗号分隔)
    adminUsers: ""
    # 授予 admin 角色的用户组列表 (逗号分隔)
    adminGroups: ""
    # 未认证浏览器请求的重定向地址，如企业 SSO 登录页 (可选)
    loginUrl: ""
  # Name of an existing Secret containing 'sessionSecret' key.
  # If empty, a random key is generated on each pod restart (sessions lost).
  # Create with: kubectl create secret generic ai-dashboard-auth --from-literal=sessionSecret=$(openssl rand -hex 32)
  existingSecret: ""
  # Set to true when TLS is enabled on Ingress
  secureCookie: false
  # OAuth signin URL override (leave empty to use default aliyun.com endpoint)
  oauthSigninURL: ""
  # OAuth token URL override
  oauthTokenURL: ""

credentials:
  # Credentials MUST be provided via a pre-created Secret named "ai-dashboard-credentials".
  # Create with:
  #   kubectl create secret generic ai-dashboard-credentials \
  #     --from-literal=accessKeyId=<YOUR_AK> \
  #     --from-literal=accessKeySecret=<YOUR_SK> \
  #     -n kube-ai
  rrsa:
    oidcProviderArn: ""
    # RAM role ARN to assume (required for rrsa mode), e.g. acs:ram::<UID>:role/<role-name>
    roleArn: ""
    oidcTokenFile: "/var/run/secrets/tokens/oidc-token"

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: chart-example.local
      paths: []
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 256Mi
  requests:
    cpu: 200m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
