# Default values for ai-dashboard.

grafana:
  image:
    repository: registry-cn-beijing.ack.aliyuncs.com/acs/grafana
    tag: 7.3.5
  # Grafana admin credentials - MUST be overridden at install time or provided via existing Secret.
  # Example: helm install --set grafana.adminPassword=<your-password>
  # Or create Secret manually: kubectl create secret generic grafana-admin --from-literal=admin-password=<pw>
  adminUser: admin
  adminPassword: ""
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: KubeAICluster
        type: prometheus
        url: ""
        access: proxy
        isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

  downloadDashboardsImage:
    repository: registry-cn-beijing.ack.aliyuncs.com/acs/curl
    tag: 7.80.0

  dashboards:
    default:
      kube-ai-node-details:
        file: dashboards/kube-ai-node-details.json
      kube-ai-cluster-details:
        file: dashboards/kube-ai-cluster-details.json
      kube-ai-resource-quota-details:
        file: dashboards/kube-ai-resource-quota-details.json
  grafana.ini:
    server:
      domain: arena-exporter-grafana
      root_url: '%(protocol)s://%(domain)s:%(http_port)s/grafana/'
      serve_from_sub_path: true
    paths:
      data: /var/lib/grafana/data
      logs: /var/log/grafana
      plugins: /var/lib/grafana/plugins
      provisioning: /etc/grafana/provisioning
    analytics:
      check_for_updates: true
    log:
      mode: console
    grafana_net:
      url: https://grafana.net
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
    security:
      allow_embedding: true
    users:
      default_theme: light

admin-ui:
  image:
    repository: registry.cn-beijing.aliyuncs.com/acs/ai-dashboard
    tag: "latest"
    pullPolicy: Always
  resources:
    limits:
      cpu: 1000m
      memory: 256Mi
    requests:
      cpu: 200m
      memory: 64Mi
  serviceAccount:
    create: true
    name: ai-dashboard-admin
  dashboard:
    intlAccount: "false"
    adminUid: ""
    credentialMode: "static"
    createWebApp: true
    ingress:
      enabled: true
      annotations:
        kubernetes.io/ingress.class: nginx
      hosts:
      - host: ai-dashboard.local
        paths:
        - /
      tls: []
  credentials:
    # AK/SK MUST NOT be stored here. Create a Secret manually:
    #   kubectl create secret generic ai-dashboard-credentials \
    #     --from-literal=accessKeyId=<AK> --from-literal=accessKeySecret=<SK> -n kube-ai
    rrsa:
      oidcProviderArn: ""
      oidcTokenFile: "/var/run/secrets/tokens/oidc-token"
