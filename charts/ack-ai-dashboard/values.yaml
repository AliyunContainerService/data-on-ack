# Default values for ai-dashboard.
# 用户必须提供的参数标记为 [REQUIRED]

grafana:
  image:
    repository: registry-cn-beijing.ack.aliyuncs.com/acs/grafana
    tag: 7.3.5
  # [REQUIRED] Grafana 管理员密码
  adminUser: admin
  adminPassword: ""
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: KubeAICluster
        type: prometheus
        # [REQUIRED] ARMS Prometheus 内网地址
        # 格式: http://cn-<region>-intranet.arms.aliyuncs.com:9090/api/v1/prometheus/<ARMS实例ID>/<主账号UID>/<集群ID>/<region>
        # 获取方式: ACK 控制台 > 集群 > 运维管理 > Prometheus监控 > 设置 > HTTP API 地址(内网)
        url: ""
        access: proxy
        isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

  downloadDashboardsImage:
    repository: registry-cn-beijing.ack.aliyuncs.com/acs/curl
    tag: 7.80.0

  dashboards:
    default:
      kube-ai-node-details:
        file: dashboards/kube-ai-node-details.json
      kube-ai-cluster-details:
        file: dashboards/kube-ai-cluster-details.json
      kube-ai-resource-quota-details:
        file: dashboards/kube-ai-resource-quota-details.json
      kube-ai-job-details:
        file: dashboards/kube-ai-job-details.json
  grafana.ini:
    server:
      domain: arena-exporter-grafana
      root_url: '%(protocol)s://%(domain)s:%(http_port)s/grafana/'
      serve_from_sub_path: true
    paths:
      data: /var/lib/grafana/data
      logs: /var/log/grafana
      plugins: /var/lib/grafana/plugins
      provisioning: /etc/grafana/provisioning
    analytics:
      check_for_updates: false
    log:
      mode: console
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
    security:
      allow_embedding: true
    users:
      default_theme: light

admin-ui:
  image:
    repository: registry-cn-hangzhou.ack.aliyuncs.com/dev/ai-dashboard
    tag: "v3.2.0"
    pullPolicy: Always
  resources:
    limits:
      cpu: 1000m
      memory: 256Mi
    requests:
      cpu: 200m
      memory: 64Mi
  serviceAccount:
    create: true
    name: ai-dashboard-admin
  dashboard:
    # 是否为国际站账号 (signin.alibabacloud.com)
    intlAccount: "false"
    # 管理员阿里云 UID (可选，留空则主账号自动为 admin)
    adminUid: ""
    # 凭据模式: static (AK/SK) 或 rrsa
    credentialMode: "static"
    # 是否自动创建 RAM OAuth2 Web App (需要 IMS 权限)
    createWebApp: true
    ingress:
      # [REQUIRED] 必须启用 Ingress 并设置域名
      enabled: true
      annotations:
        kubernetes.io/ingress.class: nginx
      hosts:
      # [REQUIRED] 运维控制台访问域名
      - host: ai-dashboard.local
        paths:
        - /
      tls: []
    # Grafana 反向代理目标 (通常无需修改)
    grafanaProxyTarget: "ack-ai-dashboard-grafana.kube-ai:80"
  # 认证与会话配置
  auth:
    # Session 持久化 Secret 名称 (推荐配置，否则 Pod 重启后用户需重新登录)
    # 创建: kubectl create secret generic ai-dashboard-auth --from-literal=sessionSecret=$(openssl rand -hex 32) -n kube-ai
    existingSecret: ""
    # TLS 启用时设为 true
    secureCookie: false
    # OAuth URL 覆盖 (通常留空使用默认值)
    oauthSigninURL: ""
    oauthTokenURL: ""
  credentials:
    # [REQUIRED] AK/SK 通过 Secret 提供，不要写在此文件中
    # 创建: kubectl create secret generic ai-dashboard-credentials \
    #   --from-literal=accessKeyId=<AK> --from-literal=accessKeySecret=<SK> -n kube-ai
    rrsa:
      oidcProviderArn: ""
      oidcTokenFile: "/var/run/secrets/tokens/oidc-token"
      # RAM 角色 ARN (rrsa 模式必填)，如 acs:ram::<UID>:role/<role-name>
      roleArn: ""
