# Default values for ai-dashboard.
# 用户必须提供的参数标记为 [REQUIRED]

grafana:
  image:
    repository: registry-cn-hangzhou.ack.aliyuncs.com/acs/grafana
    tag: 7.3.5
  # [REQUIRED] Grafana 管理员密码
  adminUser: admin
  adminPassword: ""
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: KubeAICluster
        type: prometheus
        # 默认指向 chart 内置的集群内 Prometheus（prometheus.enabled=true）。
        # 如需改用 ARMS Prometheus，设 prometheus.enabled=false 并将 url 改为
        # ARMS 内网地址: http://cn-<region>-intranet.arms.aliyuncs.com:9090/api/v1/prometheus/<实例ID>/<UID>/<集群ID>/<region>
        url: "http://prometheus-server.kube-ai:9090"
        access: proxy
        isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

  downloadDashboardsImage:
    repository: registry-cn-hangzhou.ack.aliyuncs.com/acs/curl
    tag: 7.80.0

  dashboards:
    default:
      kube-ai-node-details:
        file: dashboards/kube-ai-node-details.json
      kube-ai-cluster-details:
        file: dashboards/kube-ai-cluster-details.json
      kube-ai-resource-quota-details:
        file: dashboards/kube-ai-resource-quota-details.json
      kube-ai-job-details:
        file: dashboards/kube-ai-job-details.json
  grafana.ini:
    server:
      domain: arena-exporter-grafana
      root_url: '%(protocol)s://%(domain)s:%(http_port)s/grafana/'
      serve_from_sub_path: true
    paths:
      data: /var/lib/grafana/data
      logs: /var/log/grafana
      plugins: /var/lib/grafana/plugins
      provisioning: /etc/grafana/provisioning
    analytics:
      check_for_updates: false
    log:
      mode: console
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
    security:
      allow_embedding: true
    users:
      default_theme: light

admin-ui:
  image:
    repository: registry-cn-hangzhou.ack.aliyuncs.com/acs/ai-dashboard
    tag: "v3.3.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 256Mi
    requests:
      cpu: 200m
      memory: 64Mi
  serviceAccount:
    create: true
    name: ai-dashboard-admin
  dashboard:
    # 是否为国际站账号 (signin.alibabacloud.com)
    intlAccount: "false"
    # 管理员阿里云 UID (可选，留空则主账号自动为 admin)
    adminUid: ""
    # 凭据模式: static (AK/SK) 或 rrsa
    credentialMode: "static"
    # 是否自动创建 RAM OAuth2 Web App (需要 IMS 权限)
    createWebApp: true
    ingress:
      # [REQUIRED] 必须启用 Ingress 并设置域名
      enabled: true
      annotations:
        kubernetes.io/ingress.class: nginx
      hosts:
      # [REQUIRED] 运维控制台访问域名
      - host: ai-dashboard.local
        paths:
        - /
      tls: []
    # Grafana 反向代理目标 (通常无需修改)
    grafanaProxyTarget: "ack-ai-dashboard-grafana.kube-ai:80"
  # 认证与会话配置
  auth:
    # 认证模式:
    #   none (默认)   - 免登录，所有请求以内置 admin 身份运行，拥有全部权限；无需配置阿里云凭据，开箱即用
    #   aliyun        - 阿里云 RAM OAuth2 SSO 登录（生产推荐，需 AK/SK 与 IMS 权限）
    #   custom        - 接入客户自定义用户系统，信任上游网关注入的身份请求头
    # ⚠️ none 模式下任何能访问控制台地址的人都拥有全部权限，仅限内网/PoC 或已有外层访问控制的环境；
    #    生产环境请改用 aliyun 或 custom，或为入口配置访问控制。
    mode: "none"
    # custom 模式配置 (mode=custom 时生效)
    custom:
      # 上游网关注入的用户名请求头
      userHeader: "X-Forwarded-User"
      # 上游网关注入的用户组请求头 (逗号分隔，可选)
      groupsHeader: "X-Forwarded-Groups"
      # 授予 admin 角色的用户列表 (逗号分隔)
      adminUsers: ""
      # 授予 admin 角色的用户组列表 (逗号分隔)
      adminGroups: ""
      # 未认证浏览器请求的重定向地址，如企业 SSO 登录页 (可选)
      loginUrl: ""
    # Session 持久化 Secret 名称 (推荐配置，否则 Pod 重启后用户需重新登录)
    # 创建: kubectl create secret generic ai-dashboard-auth --from-literal=sessionSecret=$(openssl rand -hex 32) -n kube-ai
    existingSecret: ""
    # TLS 启用时设为 true
    secureCookie: false
    # OAuth URL 覆盖 (通常留空使用默认值)
    oauthSigninURL: ""
    oauthTokenURL: ""
  credentials:
    # [REQUIRED] AK/SK 通过 Secret 提供，不要写在此文件中
    # 创建: kubectl create secret generic ai-dashboard-credentials \
    #   --from-literal=accessKeyId=<AK> --from-literal=accessKeySecret=<SK> -n kube-ai
    rrsa:
      oidcProviderArn: ""
      oidcTokenFile: "/var/run/secrets/tokens/oidc-token"
      # RAM 角色 ARN (rrsa 模式必填)，如 acs:ram::<UID>:role/<role-name>
      roleArn: ""
  # 集群内 Prometheus（默认启用）：采集 arena-exporter / gpu-exporter 指标，
  # 供 Grafana 监控面板使用，无需依赖 ARMS。如改用 ARMS，设 enabled=false 并
  # 修改上方 grafana.datasources 的 url。
  prometheus:
    enabled: true
    image:
      repository: registry-cn-hangzhou.ack.aliyuncs.com/acs/prometheus
      tag: v2.54.1-9090eb1-aliyun
      pullPolicy: IfNotPresent
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
  # 平台设置播种：首次安装时写入 kubeai-platform-config（默认开发镜像等）。
  # 已存在该 ConfigMap 时不覆盖（保留用户在控制台修改的设置）。
  platformConfig:
    enabled: true
    cullingEnabled: true
    cullingIdleTime: 1440
    cullingCheckPeriod: 1
    # 默认开发镜像（AC2 公共镜像，专为 ACK AI 套件设计）
    defaultImages: |-
      ac2-registry.cn-hangzhou.cr.aliyuncs.com/ac2/jupyter:4.0.5-3.2304
      ac2-registry.cn-hangzhou.cr.aliyuncs.com/ac2/jupyter-pytorch-cuda:4.0.5-3.2304-2.1.2cu121
      ac2-registry.cn-hangzhou.cr.aliyuncs.com/ac2/vscode:4.22.1-3.2304
    # Notebook 镜像提交目标仓库（留空则由用户在控制台配置）
    commitRegistry: ""
  # 首次安装/升级时，若集群没有任何默认 StorageClass，则将
  # alicloud-disk-topology-alltype 标记为默认（Notebook 工作空间 PVC 依赖默认 SC）。
  # 不会覆盖客户已有的默认 StorageClass。
  ensureDefaultStorageClass: true
  # ensure-default-StorageClass hook 使用的镜像（alpine 3.24-update + Go 1.27.4 编译的 kubectl）
  ensureDefaultStorageClassImage: registry-cn-hangzhou.ack.aliyuncs.com/acs/kubeai-tools:v1.2.0
